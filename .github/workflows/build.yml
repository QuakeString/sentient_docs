name: Build docs
on:
  push:
    branches: [master, "v*"]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Zola and Pagefind
        run: |
          curl -fsSL https://github.com/getzola/zola/releases/download/v0.19.2/zola-v0.19.2-x86_64-unknown-linux-gnu.tar.gz | sudo tar xz -C /usr/local/bin
          curl -fsSL https://github.com/CloudCannon/pagefind/releases/download/v1.3.0/pagefind-v1.3.0-x86_64-unknown-linux-musl.tar.gz | sudo tar xz -C /usr/local/bin
      - name: Build
        run: tools/build.sh --out public
      - name: Check content rules
        run: python3 tools/check.py public
      - uses: actions/upload-artifact@v4
        with:
          name: sentient-docs-site
          path: public
          retention-days: 14
