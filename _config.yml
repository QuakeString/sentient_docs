title: SENTIENT
name: SENTIENT
author: sentient
logo: /images/sentient_logo.png
url: https://docs.sentient.invenia.in

twitter:
  username: sentient

social:
  name: SENTIENT
  links:
    - https://twitter.com/sentient
    - https://github.com/quakestring/sentient
    - https://www.facebook.com/sentient
    - https://www.youtube.com/channel/sentient

seo:
  type: WebSite

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  html_to_native: true
  hard_wrap: false
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: 'highlight'
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1
baseurl:
incremental: true

exclude:
  - .idea
#  - docs
#  - blog
#  - careers
#  - case-study
#  - case-studies
#  - _includes/docs

safe: false
lsi: false

sass:
  style: compressed

defaults:
  -
    scope:
      path: ""
    values:
      image:
        path: /images/sentient_logo.png
        twitter: /images/sentient_logo.png
        facebook: /images/sentient_logo.png
      version: "v1.0"
      githubbranch: "master"
      docsbranch: "master"
  -
    scope:
      path: docs
    values:
      layout: docwithnav
      showedit: true

permalink: pretty

plugins:
  - jekyll-redirect-from
  - jekyll-seo-tag

collections:
  careers:
    output: true

release:
  branch: release-4.3
  branch_major_next: master
  # In short form (e.g. 4.3)
  ver: 4.3.1.1
  # In short form (e.g. 4.3)
  ce_ver: 4.3.1.1
  # In short form (e.g. v4.3)
  ce_tag: v4.3.1.1
  # In full form (e.g. 4.3.0, 4.3.0.1)
  ce_full_ver: 4.3.1.1
  # In short form (e.g. 4.3pe)
  pe_ver: 4.3.1.1pe
  # In full form (e.g. 4.3.0PE, 4.3.0.1PE)
  pe_full_ver: 4.3.1.1PE
  # In short form (e.g. v4.3)
  wd_examples_commit: v4.3.1.1
  # >>> EDGE
  edge_ver: 4.3.1.1
  edge_tag: v4.3.1.1
  edge_full_ver: 4.3.1.1EDGE
  pe_edge_ver: 4.3.1.1pe
  pe_edge_full_ver: 4.3.1.1EDGEPE
  # <<< EDGE
  ce_flutter_app_ver: 1.8.0
  pe_flutter_app_ver: 1.8.0
  ce_dart_client_ver: 4.1.0
  pe_dart_client_ver: 4.1.0
  # >>> ST-RMQTT
  broker_full_ver: 2.2.0
  broker_branch: release-2.2.0
  pe_broker_full_ver: 2.2.0PE
  # <<< ST-RMQTT
  trendz_ver: 1.15.0.4
