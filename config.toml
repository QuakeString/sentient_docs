# SENTIENT documentation site (Zola). Copyright © 2016-2025 The SENTIENT Authors
# Root-relative links so the same build works online, offline and under /v/<version>/.
base_url = "/"
title = "SENTIENT Docs"
description = "Documentation for the SENTIENT industrial IoT and SCADA platform."
default_language = "en"
compile_sass = false
minify_html = false
build_search_index = false   # Pagefind builds the offline index after Zola
generate_feeds = false
ignored_content = ["*.sh", "*.json", "*.yml"]

[markdown]
highlight_code = true
highlight_theme = "css"
render_emoji = false
external_links_target_blank = true
external_links_no_referrer = true
smart_punctuation = false
bottom_footnotes = true

[slugify]
paths = "safe"
anchors = "on"

[link_checker]
internal_level = "warn"
skip_prefixes = ["http://", "https://"]

# ---------- Languages ----------
# English is the source. Hindi and Vietnamese pages are content/**/name.hi.md and
# name.vi.md; tools/i18n.py fills any page that is not translated yet with the
# English text and a note, so every URL exists in every language.
[languages.hi]
title = "SENTIENT दस्तावेज़"
description = "SENTIENT औद्योगिक IoT और SCADA प्लेटफ़ॉर्म का दस्तावेज़ीकरण।"
generate_feeds = false
build_search_index = false

[languages.vi]
title = "Tài liệu SENTIENT"
description = "Tài liệu cho nền tảng IoT công nghiệp và SCADA SENTIENT."
generate_feeds = false
build_search_index = false

