<svg class="st-diagram-svg" viewBox="0 0 1040 600" role="img" aria-labelledby="st-arch-title" xmlns="http://www.w3.org/2000/svg"><style>
.st-diagram-svg{width:100%;height:auto;font-family:var(--font-sans,Roboto,sans-serif)}
.st-diagram-svg text{text-anchor:middle;font-size:15px;fill:var(--fg)}
.st-diagram-svg .h,.st-diagram-svg .h2,.st-diagram-svg .gh,.st-diagram-svg .lbl{text-anchor:start}
.st-diagram-svg .gs{text-anchor:end;font-size:12.5px;fill:var(--muted)}
.st-diagram-svg .h{font-size:13px;font-weight:600;fill:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.st-diagram-svg .h2{font-size:12.5px;font-weight:600;fill:var(--muted)}
.st-diagram-svg .gh{font-size:16px;font-weight:700;fill:var(--accent-text)}
.st-diagram-svg .t{font-weight:600}
.st-diagram-svg .sm{font-size:14px}
.st-diagram-svg .chip{font-size:13.5px}
.st-diagram-svg .u,.st-diagram-svg .us{font-size:12px;fill:var(--muted)}
.st-diagram-svg .ta{font-weight:600;fill:var(--on-accent)}
.st-diagram-svg .ua{font-size:12.5px;fill:var(--on-accent);opacity:.85}
.st-diagram-svg .ts{font-weight:600;fill:var(--accent-text)}
.st-diagram-svg .lbl{font-size:12px;fill:var(--muted)}
.st-diagram-svg .b{fill:var(--surface);stroke:var(--line-strong);stroke-width:1.2}
.st-diagram-svg .o{fill:var(--surface);stroke:var(--line-strong);stroke-width:1.2;stroke-dasharray:5 4}
.st-diagram-svg .a{fill:var(--accent)}
.st-diagram-svg .s{fill:var(--accent-tint);stroke:var(--accent);stroke-width:1}
.st-diagram-svg .g{fill:var(--sunken);stroke:var(--accent);stroke-width:1.5}
.st-diagram-svg .ar,.st-diagram-svg .ln{fill:none;stroke:var(--muted);stroke-width:1.5}
.st-diagram-svg .dl{fill:none;stroke:var(--muted);stroke-width:1.2;stroke-dasharray:4 4}
.st-diagram-svg .ah{fill:var(--muted)}
</style><title id="st-arch-title">SENTIENT architecture: equipment connects to the SENTIENT server, which keeps its data in PostgreSQL and optionally TimescaleDB or ClickHouse, and serves operators and other systems</title><defs><marker id="st-arch-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 0 10 5 0 10z"/></marker></defs><text class="h" x="20" y="62">Equipment</text><text class="h" x="800" y="62">Storage</text><text class="h" x="800" y="384">People and systems</text><rect class="b" x="20" y="92" width="200" height="60" rx="8"/><text class="t" x="120.0" y="119.0">Devices and sensors</text><text class="u" x="120.0" y="136.0">MQTT · HTTP · CoAP · SNMP</text><rect class="b" x="20" y="220" width="200" height="56" rx="8"/><text class="t" x="120.0" y="245.0">PLCs, meters, drives</text><text class="u" x="120.0" y="262.0">Modbus · OPC UA · S7 · BACnet</text><rect class="s" x="20" y="334" width="200" height="56" rx="8"/><text class="ts" x="120.0" y="359.0">SENTIENT Gateway</text><text class="us" x="120.0" y="376.0">next to the equipment</text><rect class="b" x="20" y="452" width="200" height="56" rx="8"/><text class="t" x="120.0" y="477.0">Cloud services</text><text class="u" x="120.0" y="494.0">AWS IoT · Azure · TCP · UDP</text><rect class="g" x="290" y="40" width="470" height="442" rx="12"/><text class="gh" x="306" y="66">SENTIENT server</text><text class="gs" x="744" y="66">one program, service or container</text><rect class="b" x="305" y="84" width="440" height="78" rx="8"/><text class="h2" x="316" y="102">Device connections</text><rect class="s" x="316" y="114" width="78" height="36" rx="6"/><text class="ts chip" x="355" y="137">MQTT</text><rect class="s" x="401" y="114" width="78" height="36" rx="6"/><text class="ts chip" x="440" y="137">HTTP</text><rect class="s" x="486" y="114" width="78" height="36" rx="6"/><text class="ts chip" x="525" y="137">CoAP</text><rect class="s" x="571" y="114" width="78" height="36" rx="6"/><text class="ts chip" x="610" y="137">SNMP</text><rect class="s" x="656" y="114" width="78" height="36" rx="6"/><text class="ts chip" x="695" y="137">Integrations</text><path class="ar" d="M120 276 V330" marker-end="url(#st-arch-a)"/><path class="ar" d="M220 118 H303" marker-end="url(#st-arch-a)"/><path class="ar" d="M220 362 H265 V130 H303" marker-end="url(#st-arch-a)"/><path class="ar" d="M220 480 H280 V142 H303" marker-end="url(#st-arch-a)"/><text class="lbl" x="224" y="354">MQTT</text><rect class="b" x="305" y="190" width="210" height="52" rx="8"/><text class="t" x="410.0" y="213.0">Device actors</text><text class="u" x="410.0" y="230.0">sessions, activity, commands</text><path class="b" d="M545 194 A100.0 8 0 0 1 745 194 V238 A100.0 8 0 0 1 545 238 Z"/><path class="ln" d="M545 194 A100.0 8 0 0 0 745 194"/><text class="t" x="645.0" y="218.0">Queues</text><text class="u" x="645.0" y="234.0">Main · HighPriority</text><path class="ar" d="M410 162 V186" marker-end="url(#st-arch-a)"/><path class="ar" d="M515 216 H541" marker-end="url(#st-arch-a)"/><rect class="a" x="305" y="268" width="440" height="56" rx="8"/><text class="ta" x="525.0" y="293.0">Rule engine</text><text class="ua" x="525.0" y="310.0">rule chains · alarm rules · calculated fields</text><path class="ar" d="M645 246 V264" marker-end="url(#st-arch-a)"/><rect class="b" x="305" y="348" width="101" height="52" rx="8"/><text class="t sm" x="355.5" y="371.0">Alarms</text><text class="u" x="355.5" y="388.0">live push</text><rect class="b" x="418" y="348" width="101" height="52" rx="8"/><text class="t sm" x="468.5" y="371.0">Notifications</text><text class="u" x="468.5" y="388.0">email · SMS</text><rect class="b" x="531" y="348" width="101" height="52" rx="8"/><text class="t sm" x="581.5" y="371.0">Scheduler</text><text class="u" x="581.5" y="388.0">timed jobs</text><rect class="b" x="644" y="348" width="101" height="52" rx="8"/><text class="t sm" x="694.5" y="371.0">Reports</text><text class="u" x="694.5" y="388.0">PDF · CSV</text><path class="ar" d="M525 324 V344" marker-end="url(#st-arch-a)"/><rect class="a" x="305" y="418" width="440" height="48" rx="8"/><text class="ta" x="525.0" y="447.0">Web UI · REST API · WebSocket</text><path class="b" d="M800 80 A110.0 8 0 0 1 1020 80 V128 A110.0 8 0 0 1 800 128 Z"/><path class="ln" d="M800 80 A110.0 8 0 0 0 1020 80"/><text class="t" x="910.0" y="106.0">PostgreSQL</text><text class="u" x="910.0" y="122.0">configuration, alarms, telemetry</text><path class="b" d="M800 158 A110.0 8 0 0 1 1020 158 V206 A110.0 8 0 0 1 800 206 Z"/><path class="ln" d="M800 158 A110.0 8 0 0 0 1020 158"/><text class="t" x="910.0" y="184.0">TimescaleDB</text><text class="u" x="910.0" y="200.0">optional: compressed history</text><path class="b" d="M800 236 A110.0 8 0 0 1 1020 236 V284 A110.0 8 0 0 1 800 284 Z"/><path class="ln" d="M800 236 A110.0 8 0 0 0 1020 236"/><text class="t" x="910.0" y="262.0">ClickHouse</text><text class="u" x="910.0" y="278.0">optional: high-rate history</text><path class="ln" d="M745 296 H784 V104"/><path class="ar" d="M784 104 H797" marker-end="url(#st-arch-a)"/><path class="ar" d="M784 182 H797" marker-end="url(#st-arch-a)"/><path class="ar" d="M784 260 H797" marker-end="url(#st-arch-a)"/><rect class="b" x="800" y="396" width="220" height="48" rx="8"/><text class="t" x="910.0" y="417.0">Operators</text><text class="u" x="910.0" y="434.0">browser · mobile app</text><rect class="b" x="800" y="456" width="220" height="48" rx="8"/><text class="t" x="910.0" y="477.0">Other systems</text><text class="u" x="910.0" y="494.0">ERP · MES · scripts</text><path class="ln" d="M745 442 H780 M780 420 V480"/><path class="ar" d="M780 420 H797" marker-end="url(#st-arch-a)"/><path class="ar" d="M780 480 H797" marker-end="url(#st-arch-a)"/><text class="h" x="20" y="550">Around the server</text><path class="dl" d="M375 482 V522"/><rect class="o" x="305" y="522" width="140" height="52" rx="8"/><text class="t sm" x="375.0" y="545.0">SENTIENT translator</text><text class="u" x="375.0" y="562.0">offline translation</text><path class="dl" d="M525 482 V522"/><rect class="o" x="455" y="522" width="140" height="52" rx="8"/><text class="t sm" x="525.0" y="545.0">Platform Manager</text><text class="u" x="525.0" y="562.0">install · update</text><path class="dl" d="M675 482 V522"/><rect class="o" x="605" y="522" width="140" height="52" rx="8"/><text class="t sm" x="675.0" y="545.0">Licence server</text><text class="u" x="675.0" y="562.0">activation</text></svg>