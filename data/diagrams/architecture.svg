<svg class="st-diagram-svg" viewBox="0 0 1040 600" role="img" aria-labelledby="architecture-t" xmlns="http://www.w3.org/2000/svg"><title id="architecture-t">SENTIENT architecture: equipment connects to the SENTIENT server, which keeps its data in PostgreSQL and optionally TimescaleDB or ClickHouse, and serves operators and other systems</title><defs><marker id="architecture-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-ah" d="M0 0 10 5 0 10z"/></marker></defs><text class="dg-h" style="text-anchor:start" x="20" y="62">Equipment</text><text class="dg-h" style="text-anchor:start" x="800" y="62">Storage</text><text class="dg-h" style="text-anchor:start" x="800" y="384">People and systems</text><rect class="dg-b" x="20" y="92" width="200" height="60" rx="8"/><text class="dg-t" x="120.0" y="118.5">Devices and sensors</text><text class="dg-u" x="120.0" y="134.5">MQTT · HTTP · CoAP · SNMP</text><rect class="dg-b" x="20" y="220" width="200" height="56" rx="8"/><text class="dg-t" x="120.0" y="244.5">PLCs, meters, drives</text><text class="dg-u" x="120.0" y="260.5">Modbus · OPC UA · S7 · BACnet</text><rect class="dg-s" x="20" y="334" width="200" height="56" rx="6"/><text class="dg-ts" x="120.0" y="358.5">SENTIENT Gateway</text><text class="dg-u" x="120.0" y="374.5">next to the equipment</text><rect class="dg-b" x="20" y="452" width="200" height="56" rx="8"/><text class="dg-t" x="120.0" y="476.5">Cloud services</text><text class="dg-u" x="120.0" y="492.5">AWS IoT · Azure · TCP · UDP</text><rect class="dg-g" x="290" y="40" width="470" height="442" rx="12"/><text class="dg-gh" x="306" y="66">SENTIENT server</text><text class="dg-gs" x="744" y="66">one program, service or container</text><rect class="dg-b" x="305" y="84" width="440" height="78" rx="8"/><text class="dg-h2" style="text-anchor:start" x="316" y="102">Device connections</text><rect class="dg-chip" x="316" y="114" width="78" height="36" rx="6"/><tex