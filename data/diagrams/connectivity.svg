<svg class="st-diagram-svg" viewBox="0 0 1040 700" role="img" aria-labelledby="connectivity-t" xmlns="http://www.w3.org/2000/svg"><title id="connectivity-t">How to connect a device to SENTIENT: a decision tree from the device's network and protocol to the API, integration or gateway to use</title><defs><marker id="connectivity-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="dg-ah" d="M1 1.5 9 5 1 8.5 2.6 5Z"/></marker></defs><rect class="dg-n dg-nb" x="20" y="300" width="170" height="56" rx="10"/><text class="dg-t dg-tb" style="font-size:14.5px" x="105.0" y="323.75">Is the device on</text><text class="dg-t dg-tb" style="font-size:14.5px" x="105.0" y="341.25">an IP network?</text><rect class="dg-n dg-nb" x="230" y="130" width="180" height="56" rx="10"/><text class="dg-t dg-tb" style="font-size:14.5px" x="320.0" y="153.75">Can you change</text><text class="dg-t dg-tb" style="font-size:14.5px" x="320.0" y="171.25">its firmware?</text><rect class="dg-n dg-nb" x="230" y="520" width="180" height="56" rx="10"/><text class="dg-t dg-tb" style="font-size:14.5px" x="320.0" y="543.75">Does it use LoRaWAN,</text><text class="dg-t dg-tb" style="font-size:14.5px" x="320.0" y="561.25">Sigfox or NB-IoT?</text><rect class="dg-n dg-nb" x="450" y="60" width="180" height="56" rx="10"/><text class="dg-t dg-tb" style="font-size:14.5px" x="540.0" y="83.75">Is it a gateway</text><text class="dg-t dg-tb" style="font-size:14.5px" x="540.0" y="101.25">for other devices?</text><rect class="dg-n dg-nb" x="450" y="170" width="180" height="44" rx="10"/><text class="dg-t dg-tb" style="font-size:14.5px" x="540.0" y="196.5">Choose a protocol</text><rect class="dg-n dg-nb" x="450" y="280" width="180" height="56" rx="10"/><text class="dg-t dg-tb" style="font-size:14.5px" x="540.0" y="303.75">Does it already send data</text><text class="dg-t dg-tb" style="font-size:14.5px" x="540.0" y="321.25">to a cloud platform?</text><rect class="dg-n dg-nb" x="450" y="390" width="180" height="56" rx="10"/><text class="dg-t dg-tb" style="font-size:14.5px" x="540.0" y="413.75">Can it call a</text><text class="dg-t dg-tb" style="font-size:14.5px" x="540.0" y="431.25">webhook (HTTP)?</text><rect class="dg-n dg-nb" x="450" y="474" width="180" height="44" rx="10"/><text class="dg-t dg-tb" style="font-size:14.5px" x="540.0" y="500.5">Choose a protocol</text><rect class="dg-n dg-nb" x="450" y="590" width="180" height="56" rx="10"/><text class="dg-t dg-tb" style="font-size:14.5px" x="540.0" y="613.75">Modbus, OPC UA, S7,</text><text class="dg-t dg-tb" style="font-size:14.5px" x="540.0" y="631.25">BACnet, CAN or BLE?</text><rect class="dg-n dg-na" x="820" y="20" width="200" height="40" rx="10"/><rect class="dg-tile dg-tilea" x="832" y="27.0" width="26" height="26" rx="8"/><g class="dg-ic dg-ica" transform="translate(837.7 32.7) scale(0.607)"><rect x="2" y="14" width="20" height="8" rx="2"/><path d="M6.01 18H6M10.01 18H10M15 10v4M17.84 7.17a4 4 0 0 0-5.66 0M20.66 4.34a8 8 0 0 0-11.31 0"/></g><text class="dg-t dg-ta" style="text-anchor:start;font-size:13.5px" x="869" y="44.5">MQTT Gateway API</text><rect class="dg-n dg-na" x="820" y="72" width="200" height="40" rx="10"/><text class="dg-t dg-ta" style="font-size:13.5px" x="920.0" y="96.5">MQTT API</text><rect class="dg-n dg-na" x="820" y="124" width="200" height="40" rx="10"/><text class="dg-t dg-ta" style="font-size:13.5px" x="920.0" y="148.5">HTTP API</text><rect class="dg-n dg-na" x="820" y="176" width="200" height="40" rx="10"/><text class="dg-t dg-ta" style="font-size:13.5px" x="920.0" y="200.5">CoAP API</text><rect class="dg-n dg-na" x="820" y="228" width="200" height="40" rx="10"/><text class="dg-t dg-ta" style="font-size:13.5px" x="920.0" y="252.5">MQTT Sparkplug API</text><rect class="dg-n dg-ns" x="820" y="282" width="200" height="52" rx="10"/><text class="dg-t dg-ts" style="font-size:13.5px" x="920.0" y="304.25">Integration</text><t