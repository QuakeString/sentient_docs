<svg class="st-diagram-svg" viewBox="0 0 1040 700" role="img" aria-labelledby="connectivity-t" xmlns="http://www.w3.org/2000/svg"><title id="connectivity-t">How to connect a device to SENTIENT: a decision tree from the device's network and protocol to the API, integration or gateway to use</title><defs><marker id="connectivity-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-ah" d="M0 0 10 5 0 10z"/></marker></defs><rect class="dg-b" x="20" y="300" width="170" height="56" rx="8"/><text class="dg-t" x="105.0" y="324.5">Is the device on</text><text class="dg-t" x="105.0" y="341.5">an IP network?</text><rect class="dg-b" x="230" y="130" width="180" height="56" rx="8"/><text class="dg-t" x="320.0" y="154.5">Can you change</text><text class="dg-t" x="320.0" y="171.5">its firmware?</text><rect class="dg-b" x="230" y="520" width="180" height="56" rx="8"/><text class="dg-t" x="320.0" y="544.5">Does it use LoRaWAN,</text><text class="dg-t" x="320.0" y="561.5">Sigfox or NB-IoT?</text><rect class="dg-b" x="450" y="60" width="180" height="56" rx="8"/><text class="dg-t" x="540.0" y="84.5">Is it a gateway</text><text class="dg-t" x="540.0" y="101.5">for other devices?</text><rect class="dg-b" x="450" y="170" width="180" height="44" rx="8"/><text class="dg-t" x="540.0" y="197.0">Choose a protocol</text><rect class="dg-b" x="450" y="280" width="180" height="56" rx="8"/><text class="dg-t" x="540.0" y="304.5">Does it already send data</text><text class="dg-t" x="540.0" y="321.5">to a cloud platform?</text><rect class="dg-b" x="450" y="390" width="180" height="56" rx="8"/><text class="dg-t" x="540.0" y="414.5">Can it call a</text><text class="dg-t" x="540.0" y="431.5">webhook (HTTP)?</text><rect class="dg-b" x="450" y="474" width="180" height="44" rx="8"/><text class="dg-t" x="540.0" y="501.0">Choose a protocol</text><rect class="dg-b" x="450" y="590" width="180" height="56" rx="8"/><text class="dg-t" x="540.0" y="614.5">Modbus, OPC UA, S7,</text><text class="dg-t" x="540.0" y="631.5">BACnet, CAN or BLE?</text><rect class="dg-a" x="820" y="20" width="200" height="40" rx="8"/><text class="dg-ta dg-sm" x="920.0" y="45.0">MQTT Gateway API</text><rect class="dg-a" x="820" y="72" width="200" height="40" rx="8"/><text class="dg-ta dg-sm" x="920.0" y="97.0">MQTT API</text><rect class="dg-a" x="820" y="124" width="200" height="40" rx="8"/><text class="dg-ta dg-sm" x="920.0" y="149.0">HTTP API</text><rect class="dg-a" x="820" y="176" width="200" height="40" rx="8"/><text class="dg-ta dg-sm" x="920.0" y="201.0">CoAP API</text><rect class="dg-a" x="820" y="228" width="200" height="40" rx="8"/><text class="dg-ta dg-sm" x="920.0" y="253.0">MQTT Sparkplug API</text><rect class="dg-s" x="820" y="282" width="200" height="52" rx="6"/><text class="dg-ts dg-sm" x="920.0" y="304.5">Integration</text><text class="dg-u" x="920.0" y="320.5">AWS IoT · Azure · MQTT · OPC UA</text><rect class="dg-s" x="820" y="352" width="200" height="40" rx="6"/><text class="dg-ts dg-sm" x="920.0" y="377.0">HTTP integration</text><rect class="dg-a" x="820" y="404" width="200" height="40" rx="8"/><text class="dg-ta dg-sm" x="920.0" y="429.0">SNMP API</text><rect class="dg-s" x="820" y="456" width="200" height="40" rx="6"/><text class="dg-ts dg-sm" x="920.0" y="481.0">CoAP integration</text><rect class="dg-b" x="820" y="508" width="200" height="40" rx="8"/><text class="dg-t dg-sm" x="920.0" y="533.0">Ask us</text><rect class="dg-s" x="820" y="560" width="200" height="40" rx="6"/><text class="dg-ts dg-sm" x="920.0" y="585.0">Platform integrations</text><rect class="dg-s" x="820" y="612" width="200" height="40" rx="6"/><text class="dg-ts dg-sm" x="920.0" y="637.0">SENTIENT Gateway</text><rect class="dg-b" x="820" y="656" width="200" height="36" rx="8"/><text class="dg-t dg-sm" x="920.0" y="679.0">Ask us</text><path class="dg-ar" d="M190 328.0 L210 328.0 L210 158.0 L227 158.0" marker-end="url(#connectivity-a)"/><text class="dg-lbl" style="text-anchor:end" x="219" y="151.0">Yes</text><path class="dg-ar" d="M190 328.0 L210 328.0 L210 548.0 L227 548.0" marker-end="url(#connectivity-a)"/><text class="dg-lbl" style="text-anchor:end" x="219" y="541.0">No</text><path class="dg-ar" d="M410 158.0 L430 158.0 L430 88.0 L447 88.0" marker-end="url(#connectivity-a)"/><text class="dg-lbl" style="text-anchor:end" x="439" y="81.0">Yes</text><path class="dg-ar" d="M410 158.0 L430 158.0 L430 308.0 L447 308.0" marker-end="url(#connectivity-a)"/><text class="dg-lbl" style="text-anchor:end" x="439" y="301.0">No</text><path class="dg-ar" d="M630 88.0 L700 88.0 L700 40.0 L817 40.0" marker-end="url(#connectivity-a)"/><text class="dg-lbl" style="text-anchor:end" x="809" y="33.0">Yes</text><path class="dg-ar" d="M540.0 116 L540.0 167" marker-end="url(#connectivity-a)"/><text class="dg-lbl" style="text-anchor:start" x="548.0" y="145.5">No</text><path class="dg-ar" d="M630 192.0 L720 192.0 L720 92.0 L817 92.0" marker-end="url(#connectivity-a)"/><text class="dg-lbl" style="text-anchor:end" x="809" y="85.0">MQTT</text><path class="dg-ar" d="M630 192.0 L720 192.0 L720 144.0 L817 144.0" marker-end="url(#connectivity-a)"/><text class="dg-lbl" style="text-anchor:end" x="809" y="137.0">HTTP</text><path class="dg-ar" d="M630 192.0 L720 192.0 L720 196.0 L817 196.0" marker-end="url(#connectivity-a)"/><text class="dg-lbl" style="text-anchor:end" x="809" y="189.0">CoAP</text><path class="dg-ar" d="M630 192.0 L720 192.0 L720 248.0 L817 248.0" marker-end="url(#connectivity-a)"/><text class="dg-lbl" style="text-anchor:end" x="809" y="241.0">Sparkplug</text><path class="dg-ar" d="M630 308.0 L817 308.0" marker-end="url(#connectivity-a)"/><text class="dg-lbl" style="text-anchor:end" x="809" y="301.0">Yes</text><path class="dg-ar" d="M540.0 336 L540.0 387" marker-end="url(#connectivity-a)"/><text class="dg-lbl" style="text-anchor:start" x="548.0" y="365.5">No</text><path class="dg-ar" d="M630 418.0 L700 418.0 L700 372.0 L817 372.0" marker-end="url(#connectivity-a)"/><text class="dg-lbl" style="text-anchor:end" x="809" y="365.0">Yes</text><path class="dg-ar" d="M540.0 446 L540.0 471" marker-end="url(#connectivity-a)"/><text class="dg-lbl" style="text-anchor:start" x="548.0" y="462.5">No</text><path class="dg-ar" d="M630 496.0 L740 496.0 L740 424.0 L817 424.0" marker-end="url(#connectivity-a)"/><text class="dg-lbl" style="text-anchor:end" x="809" y="417.0">SNMP</text><path class="dg-ar" d="M630 496.0 L740 496.0 L740 476.0 L817 476.0" marker-end="url(#connectivity-a)"/><text class="dg-lbl" style="text-anchor:end" x="809" y="469.0">CoAP</text><path class="dg-ar" d="M630 496.0 L740 496.0 L740 528.0 L817 528.0" marker-end="url(#connectivity-a)"/><text class="dg-lbl" style="text-anchor:end" x="809" y="521.0">Other</text><path class="dg-ar" d="M410 536.8 L700 536.8 L700 580.0 L817 580.0" marker-end="url(#connectivity-a)"/><text class="dg-lbl" style="text-anchor:end" x="809" y="573.0">Yes</text><path class="dg-ar" d="M410 562.0 L430 562.0 L430 618.0 L447 618.0" marker-end="url(#connectivity-a)"/><text class="dg-lbl" style="text-anchor:end" x="439" y="611.0">No</text><path class="dg-ar" d="M630 609.6 L760 609.6 L760 632.0 L817 632.0" marker-end="url(#connectivity-a)"/><text class="dg-lbl" style="text-anchor:end" x="809" y="625.0">Yes</text><path class="dg-ar" d="M630 632.0 L740 632.0 L740 674.0 L817 674.0" marker-end="url(#connectivity-a)"/><text class="dg-lbl" style="text-anchor:end" x="809" y="667.0">No</text></svg>
