<svg class="st-diagram-svg" viewBox="0 0 900 380" role="img" aria-labelledby="device-provisioning-t" xmlns="http://www.w3.org/2000/svg"><title id="device-provisioning-t">Device provisioning: the device sends a provisioning request, SENTIENT checks it and creates credentials, and the device connects with them</title><defs><marker id="device-provisioning-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-ah" d="M0 0 10 5 0 10z"/></marker></defs><rect class="dg-b" x="120" y="20" width="150" height="44" rx="8"/><text class="dg-t" x="195.0" y="47.0">Device</text><rect class="dg-a" x="520" y="20" width="180" height="44" rx="8"/><text class="dg-ta" x="610.0" y="47.0">SENTIENT server</text><path class="dg-dl" d="M195 64 L195 360"/><path class="dg-dl" d="M610 64 L610 360"/><path class="dg-ar" d="M198 120 L606 120" marker-end="url(#device-provisioning-a)"/><text class="dg-lbl" style="text-anchor:middle" x="400" y="100">Provisioning request</text><text class="dg-u" style="text-anchor:middle" x="400" y="136">provision key and secret, device name, credentials</text><rect class="dg-b" x="640" y="96" width="240" height="54" rx="8"/><text class="dg-t dg-sm" x="760.0" y="119.5">Checks the key and secret against</text><text class="dg-t dg-sm" x="760.0" y="136.5">the device profile's provisioning rule</text><path class="dg-ar" d="M612 123 L636 123"/><rect class="dg-b" x="640" y="162" width="240" height="54" rx="8"/><text class="dg-t dg-sm" x="760.0" y="185.5">Checks the device is not</text><text class="dg-t dg-sm" x="760.0" y="202.5">registered yet</text><path class="dg-ar" d="M612 189 L636 189"/><rect class="dg-b" x="640" y="228" width="240" height="54" rx="8"/><text class="dg-t dg-sm" x="760.0" y="251.5">Creates the device and</text><text class="dg-t dg-sm" x="760.0" y="268.5">stores its credentials</text><path class="dg-ar" d="M612 255 L636 255"/><path class="dg-ar" d="M606 270 L198 270" marker-end="url(#device-provisioning-a)"/><text class="dg-lbl" style="text-anchor:middle" x="400" y="250">Provisioning response</text><text class="dg-u" style="text-anchor:middle" x="400" y="286">new credentials</text><rect class="dg-b" x="10" y="300" width="165" height="40" rx="8"/><text class="dg-t dg-sm" x="92.5" y="325.0">Saves the credentials</text><path class="dg-ar" d="M178 320 L193 320"/><path class="dg-ar" d="M198 340 L606 340" marker-end="url(#device-provisioning-a)"/><text class="dg-lbl" style="text-anchor:middle" x="400" y="330">Connects with the new credentials</text></svg>
