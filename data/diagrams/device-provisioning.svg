<svg class="st-diagram-svg" viewBox="0 0 900 380" role="img" aria-labelledby="device-provisioning-t" xmlns="http://www.w3.org/2000/svg"><title id="device-provisioning-t">Device provisioning: the device sends a provisioning request, SENTIENT checks it and creates credentials, and the device connects with them</title><defs><marker id="device-provisioning-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="dg-ah" d="M1 1.5 9 5 1 8.5 2.6 5Z"/></marker></defs><rect class="dg-n dg-nb" x="120" y="20" width="150" height="44" rx="10"/><rect class="dg-tile dg-tileb" x="132" y="29.0" width="26" height="26" rx="8"/><g class="dg-ic dg-icb" transform="translate(137.7 34.7) scale(0.607)"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6" rx="1"/><path d="M15 2v2M15 20v2M2 15h2M2 9h2M20 15h2M20 9h2M9 2v2M9 20v2"/></g><text class="dg-t dg-tb" style="text-anchor:start;font-size:13.5px" x="169" y="46.5">Device</text><rect class="dg-n dg-na" x="520" y="20" width="180" height="44" rx="10"/><rect class="dg-tile dg-tilea" x="532" y="29.0" width="26" height="26" rx="8"/><g class="dg-ic dg-ica" transform="translate(537.7 34.7) scale(0.607)"><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><path d="M6 6h.01M6 18h.01"/></g><text class="dg-t dg-ta" style="text-anchor:start;font-size:14.5px" x="569" y="46.5">SENTIENT server</text><path class="dg-dl" d="M195.0 64.0 L195.0 360.0"/><path class="dg-dl" d="M610.0 64.0 L610.0 360.0"/><path class="dg-ar" d="M198.0 120.0 L606.0 120.0" marker-end="url(#device-provisioning-a)"/><text class="dg-u" style="text-anchor:middle" x="400" y="136">provision key and secret, device name, credentials</text><rect class="dg-n dg-nb" x="640" y="96" width="240" height="54" rx="10"/><text class="dg-t dg-tb" style="font-size:13.5px" x="760.0" y="119.25">Checks the key and secret against</text><text class="dg-t dg-tb" style="font-size:13.5px" x="760.0" y="135.75">the device profile's provisioning rule</text><path class="dg-ar" d="M612.0 123.0 L636.0 123.0"/><rect class="dg-n dg-nb" x="640" y="162" width="240" height="54" rx="10"/><rect class="dg-tile dg-tileb" x="652" y="173.0" width="32" height="32" rx="8"/><g class="dg-ic dg-icb" transform="translate(659.0 180.0) scale(0.747)"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6" rx="1"/><path d="M15 2v2M15 20v2M2 15h2M2 9h2M20 15h2M20 9h2M9 2v2M9 20v2"/></g><text class="dg-t dg-tb" style="text-anchor:start;font-size:13.5px" x="695" y="185.25">Checks the device is not</text><text class="dg-t dg-tb" style="text-anchor:start;font-size:13.5px" x="695" y="201.75">registered yet</text><path class="dg-ar" d="M612.0 189.0 L636.0 189.0"/><rect class="dg-n dg-nb" x="640" y="228" width="240" height="54" rx="10"/><rect class="dg-tile dg-tileb" x="652" y="239.0" width="32" height="32" rx="8"/><g class="dg-ic dg-icb" transform="translate(659.0 246.0) scale(0.747)"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6" rx="1"/><path d="M15 2v2M15 20v2M2 15h2M2 9h2M20 15h2M20 9h2M9 2v2M9 20v2"/></g><text class="dg-t dg-tb" style="text-anchor:start;font-size:13.5px" x="695" y="251.25">Creates the device and</text><text class="dg-t dg-tb" style="text-anchor:start;font-size:13.5px" x="695" y="267.75">stores its credentials</text><path class="dg-ar" d="M612.0 255.0 L636.0 255.0"/><path class="dg-ar" d="M606.0 270.0 L198.0 270.0" marker-end="url(#device-provisioning-a)"/><text class="dg-u" style="text-anchor:middle" x="400" y="286">new credentials</text><rect class="dg-n dg-nb" x="10" y="300" width="165" height="40" rx="10"/><text class="dg-t dg-tb" style="font-size:13.5px" x="92.5" y="324.5">Saves the credentials</text><path class="dg-ar" d="M178.0 320.0 L193.0 320.0"/><path class="dg-ar" d="M198.0 340.0 L606.0 340.0" marker-end="url(#device-provisioning-a)"/><rect class="dg-pill" x="341.2" y="87.5" width="117.5" height="18" rx="9"/><text class="dg-lbl" style="text-anchor:middle" x="400" y="100">Provisioning request</text><rect class="dg-pill" x="338.7" y="237.5" width="122.7" height="18" rx="9"/><text class="dg-lbl" style="text-anchor:middle" x="400" y="250">Provisioning response</text><rect class="dg-pill" x="307.6" y="317.5" width="184.8" height="18" rx="9"/><text class="dg-lbl" style="text-anchor:middle" x="400" y="330">Connects with the new credentials</text></svg>
