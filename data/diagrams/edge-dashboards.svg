<svg class="st-diagram-svg" viewBox="0 0 900 260" role="img" aria-labelledby="edge-dashboards-t" xmlns="http://www.w3.org/2000/svg"><title id="edge-dashboards-t">Batch update: change a dashboard once on the SENTIENT server and it is sent to every Edge</title><defs><marker id="edge-dashboards-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-ah" d="M0 0 10 5 0 10z"/></marker></defs><rect class="dg-a" x="330" y="16" width="240" height="60" rx="8"/><text class="dg-ta" x="450.0" y="42.5">SENTIENT server</text><text class="dg-ua" x="450.0" y="58.5">dashboard changed once</text><rect class="dg-s" x="40" y="160" width="240" height="60" rx="6"/><text class="dg-ts" x="160.0" y="186.5">SENTIENT Edge 1</text><text class="dg-u" x="160.0" y="202.5">gets the new dashboard</text><path class="dg-ar" d="M450 80 L450 120 L160 120 L160 156" marker-end="url(#edge-dashboards-a)"/><rect class="dg-s" x="330" y="160" width="240" height="60" rx="6"/><text class="dg-ts" x="450.0" y="186.5">SENTIENT Edge 2</text><text class="dg-u" x="450.0" y="202.5">gets the new dashboard</text><path class="dg-ar" d="M450 80 L450 120 L450 120 L450 156" marker-end="url(#edge-dashboards-a)"/><rect class="dg-s" x="620" y="160" width="240" height="60" rx="6"/><text class="dg-ts" x="740.0" y="186.5">SENTIENT Edge 3</text><text class="dg-u" x="740.0" y="202.5">gets the new dashboard</text><path class="dg-ar" d="M450 80 L450 120 L740 120 L740 156" marker-end="url(#edge-dashboards-a)"/></svg>
