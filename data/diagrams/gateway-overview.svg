<svg class="st-diagram-svg" viewBox="0 0 1040 556" role="img" aria-labelledby="gateway-overview-t" xmlns="http://www.w3.org/2000/svg"><title id="gateway-overview-t">SENTIENT Gateway: connectors read equipment over industrial protocols, converters turn the data into telemetry and attributes, and the gateway sends it to the SENTIENT server over MQTT</title><defs><marker id="gateway-overview-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-ah" d="M0 0 10 5 0 10z"/></marker></defs><rect class="dg-a" x="400" y="16" width="240" height="52" rx="8"/><text class="dg-ta" x="520.0" y="47.0">SENTIENT server</text><rect class="dg-g" x="20" y="104" width="1000" height="290" rx="12"/><text class="dg-gh" x="36" y="130">SENTIENT Gateway</text><text class="dg-gs" x="1004" y="130">Windows, Linux or Docker, next to the equipment</text><rect class="dg-s" x="300" y="142" width="200" height="48" rx="6"/><text class="dg-ts dg-sm" x="400.0" y="162.5">Gateway service</text><text class="dg-u" x="400.0" y="178.5">keeps sending, reconnects</text><path class="dg-b" d="M540 148 A90.0 8 0 0 1 720 148 V184 A90.0 8 0 0 1 540 184 Z"/><path class="dg-ln" d="M540 148 A90.0 8 0 0 0 720 148"/><text class="dg-t" x="630.0" y="168.0">Local storage</text><text class="dg-u" x="630.0" y="184.0">holds data while offline</text><rect class="dg-b" x="760" y="142" width="200" height="48" rx="8"/><text class="dg-t dg-sm" x="860.0" y="162.5">Local web page</text><text class="dg-u" x="860.0" y="178.5">setup and status</text><path class="dg-ar" d="M520 68 L520 138" marker-end="url(#gateway-overview-a)" marker-start="url(#gateway-overview-a)"/><text class="dg-lbl" style="text-anchor:start" x="530" y="90">MQTT over TLS</text><path class="dg-ar" d="M500 166 L536 166" marker-end="url(#gateway-overview-a)" marker-start="url(#gateway-overview-a)"/><text class="dg-h2" style="text-anchor:start" x="40" y="232">Connectors, each with a converter</text><rect clas