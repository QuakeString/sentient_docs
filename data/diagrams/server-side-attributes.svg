<svg class="st-diagram-svg" viewBox="0 0 900 230" role="img" aria-labelledby="server-side-attributes-t" xmlns="http://www.w3.org/2000/svg"><title id="server-side-attributes-t">Server-side attributes: only applications on the server side save and read them; the device cannot see them</title><defs><marker id="server-side-attributes-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-ah" d="M0 0 10 5 0 10z"/></marker></defs><rect class="dg-o" x="20" y="70" width="150" height="90" rx="8"/><text class="dg-t" x="95.0" y="111.5">Device</text><text class="dg-u" x="95.0" y="127.5">firmware</text><rect class="dg-a" x="370" y="50" width="160" height="130" rx="8"/><text class="dg-ta" x="450.0" y="120.0">SENTIENT server</text><rect class="dg-b" x="730" y="70" width="150" height="90" rx="8"/><text class="dg-t" x="805.0" y="103.0">Server-side</text><text class="dg-t" x="805.0" y="120.0">application</text><text class="dg-u" x="805.0" y="136.0">dashboard, script, API</text><path class="dg-ar" d="M724 93.0 L536 93.0" marker-end="url(#server-side-attributes-a)"/><text class="dg-lbl" style="text-anchor:middle" x="630.0" y="85.0">Save attributes</text><path class="dg-ar" d="M724 137.0 L536 137.0" marker-end="url(#server-side-attributes-a)" marker-start="url(#server-side-attributes-a)"/><text class="dg-lbl" style="text-anchor:middle" x="630.0" y="129.0">Read attributes</text><text class="dg-lbl" style="text-anchor:middle" x="95" y="196">does not see them</text></svg>
