<svg class="st-diagram-svg" viewBox="0 0 1000 250" role="img" aria-labelledby="sigfox-integration-t" xmlns="http://www.w3.org/2000/svg"><title id="sigfox-integration-t">Sigfox: Sigfox backend sends data over HTTP; the integration hands it to the uplink converter, which turns it into telemetry and attributes for the rule engine. Attribute updates and RPC go back through the downlink converter</title><defs><marker id="sigfox-integration-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-ah" d="M0 0 10 5 0 10z"/></marker></defs><rect class="dg-b" x="20" y="95" width="170" height="60" rx="8"/><text class="dg-t" x="105.0" y="130.0">Sigfox backend</text><rect class="dg-s" x="250" y="95" width="170" height="60" rx="6"/><text class="dg-ts dg-sm" x="335.0" y="121.5">Sigfox</text><text class="dg-u" x="335.0" y="137.5">integration</text><rect class="dg-s" x="490" y="40" width="170" height="52" rx="6"/><text class="dg-ts dg-sm" x="575.0" y="62.5">Uplink converter</text><text class="dg-u" x="575.0" y="78.5">decodes the payload</text><rect class="dg-s" x="490" y="158" width="170" height="52" rx="6"/><text class="dg-ts dg-sm" x="575.0" y="180.5">Downlink converter</text><text class="dg-u" x="575.0" y="196.5">encodes commands</text><rect class="dg-g" x="740" y="20" width="240" height="210" rx="12"/><text class="dg-gh" x="756" y="46">SENTIENT server</text><rect class="dg-a" x="758" y="60" width="204" height="56" rx="8"/><text class="dg-ta dg-sm" x="860.0" y="84.5">Rule engine</text><text class="dg-ua" x="860.0" y="100.5">rule chains, alarms</text><rect class="dg-a" x="758" y="140" width="204" height="56" rx="8"/><text class="dg-ta dg-sm" x="860.0" y="164.5">Dashboards</text><text class="dg-ua" x="860.0" y="180.5">live values</text><path class="dg-ar" d="M190 125 L246 125" marker-end="url(#sigfox-integration-a)" marker-start="url(#sigfox-integration-a)"/><text class="dg-lbl" style="text-anchor:middle" x="218" y="117">HTTP</text><path class="dg-ar" d="M420 112 L455 112 L455 66 L486 66" marker-end="url(#sigfox-integration-a)"/><text class="dg-lbl" style="text-anchor:middle" x="455" y="25">JSON · binary · text</text><path class="dg-ar" d="M486 184 L455 184 L455 138 L424 138" marker-end="url(#sigfox-integration-a)"/><path class="dg-ar" d="M660 66 L700 66 L700 88 L754 88" marker-end="url(#sigfox-integration-a)"/><text class="dg-lbl" style="text-anchor:middle" x="700" y="28">telemetry,</text><text class="dg-lbl" style="text-anchor:middle" x="700" y="42">attributes</text><path class="dg-ar" d="M758 160 L700 160 L700 184 L664 184" marker-end="url(#sigfox-integration-a)"/><text class="dg-lbl" style="text-anchor:middle" x="700" y="224">attribute</text><text class="dg-lbl" style="text-anchor:middle" x="700" y="238">updates, RPC</text></svg>
