headline: अपने प्लांट को चलाने में हम आपकी कैसे मदद करें?
lede: SENTIENT के लिए चरण-दर-चरण गाइड, प्लेटफ़ॉर्म इंस्टॉल करने से लेकर PLC जोड़ने, SCADA स्क्रीन बनाने और आम त्रुटियाँ ठीक करने तक।
popular: [Modbus, बैकअप, अलार्म नियम, OPC UA, डैशबोर्ड]
tiles:
  - {title: शुरू करें, icon: i-rocket, path: /docs/getting-started-guides/helloworld/, text: "साइन इन करें, अपना पहला डिवाइस जोड़ें और लाइव मान देखें।"}
  - {title: इंस्टॉल और अपग्रेड, icon: i-server, path: /docs/installation/, text: "Windows पर Platform Manager, Docker, लाइसेंस, बैकअप और अपग्रेड।"}
  - {title: उपकरण जोड़ें, icon: i-chip, path: /docs/iot-gateway/, text: "गेटवे, Modbus, OPC UA, S7, BACnet और MQTT डिवाइस।"}
  - {title: डैशबोर्ड और SCADA, icon: i-dash, path: /docs/user-guide/dashboards/, text: "विजेट, SCADA सिंबल और डैशबोर्ड एडिटर।"}
  - {title: अलार्म और सूचनाएँ, icon: i-bell, path: /docs/user-guide/alarms/, text: "अलार्म नियम, सूचना केंद्र और डिलीवरी चैनल।"}
  - {title: रूल इंजन, icon: i-gear, path: /docs/user-guide/rule-engine-2-0/overview/, text: "आने वाले डेटा को प्रोसेस, रूट और समृद्ध करें।"}
