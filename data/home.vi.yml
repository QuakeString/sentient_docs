headline: Chúng tôi có thể giúp gì cho việc vận hành nhà máy của bạn?
lede: Hướng dẫn từng bước cho SENTIENT, từ cài đặt nền tảng đến kết nối PLC, xây dựng màn hình SCADA và khắc phục các lỗi thường gặp.
popular: [Modbus, Sao lưu, Quy tắc cảnh báo, OPC UA, Bảng điều khiển]
tiles:
  - {title: Bắt đầu, icon: i-rocket, path: /docs/getting-started-guides/helloworld/, text: "Đăng nhập, thêm thiết bị đầu tiên và xem giá trị trực tiếp."}
  - {title: Cài đặt và nâng cấp, icon: i-server, path: /docs/installation/, text: "Platform Manager trên Windows, Docker, giấy phép, sao lưu và nâng cấp."}
  - {title: Kết nối thiết bị, icon: i-chip, path: /docs/iot-gateway/, text: "Gateway, thiết bị Modbus, OPC UA, S7, BACnet và MQTT."}
  - {title: Bảng điều khiển và SCADA, icon: i-dash, path: /docs/user-guide/dashboards/, text: "Widget, ký hiệu SCADA và trình chỉnh sửa bảng điều khiển."}
  - {title: Cảnh báo và thông báo, icon: i-bell, path: /docs/user-guide/alarms/, text: "Quy tắc cảnh báo, trung tâm thông báo và các kênh gửi."}
  - {title: Rule engine, icon: i-gear, path: /docs/user-guide/rule-engine-2-0/overview/, text: "Xử lý, định tuyến và bổ sung dữ liệu đến."}
