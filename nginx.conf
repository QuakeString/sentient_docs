# SENTIENT docs — nginx config for the production container.
#
# Serves the Jekyll-built static site from /usr/share/nginx/html.
# No upstream, no FastCGI — pure sendfile() to the socket.

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Resolve Jekyll-style clean URLs: /path → /path/index.html.
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Long-cache hashed assets. Jekyll/GH-pages doesn't fingerprint
    # filenames by default, so we don't use `immutable`; 7 days is a
    # safe middle ground that still lets a deploy invalidate via
    # Cache-Control negotiation on the HTML pages.
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|woff2?|ttf|ico|webp|mp4|webm)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # Compress text payloads on the fly. Skip already-compressed
    # binary formats.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # nginx file metadata cache — keeps inode lookups cheap on a
    # 32k-file site. Caps RAM cost at ~5 MB.
    open_file_cache max=2000 inactive=60s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # Friendly 404 — serves Jekyll's 404.html if present.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
