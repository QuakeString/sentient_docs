<div class="helpful" data-pagefind-ignore>Was this page helpful? <button type="button" data-helpful="yes">Yes</button><button type="button" data-helpful="no">No</button>
  {% if page.relative_path %}<a class="edit" href="{{ config.extra.repo_edit_url | safe }}{{ page.relative_path | safe }}" target="_blank" rel="noopener"><svg class="icon" style="width:15px;height:15px;vertical-align:-3px"><use href="#i-pen"/></svg> Suggest an edit</a>{% endif %}</div>
{%- if page.lower or page.higher %}
<div class="pager" data-pagefind-ignore>
  {% if page.lower %}<a href="{{ page.lower.permalink | safe }}"><small>Previous</small>{{ page.lower.title }}</a>{% else %}<span></span>{% endif %}
  {% if page.higher %}<a href="{{ page.higher.permalink | safe }}"><small>Next</small>{{ page.higher.title }}</a>{% endif %}
</div>
{%- endif %}
